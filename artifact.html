<title>나고야 뚜벅이 노선도</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
/* ===== tokens ===== */
:root{
  --paper:#EFF1F6; --card:#FFFFFF; --card-2:#F7F8FB; --sheet:#FFFFFF;
  --ink:#14161E; --ink-2:#3B4050; --muted:#697086;
  --rule:#E1E3EB; --rule-2:#C3C7D4;
  --yellow:#B07C00; --yellow-line:#F0B417;
  --purple:#7E3F96; --purple-line:#9A5CAC;
  --red:#B8352A; --red-line:#CE4436;
  --bus:#1B6B4F; --bus-line:#2E8F69;
  --jr:#2E5EA8; --jr-line:#5A8FD8;
  --walk:#7B8296;
  --warn:#9C3407; --warn-bg:#FBEDE5; --warn-rule:#EFCAB4;
  --ok:#146042; --ok-bg:#E7F3EC; --ok-rule:#BCDDCA;
  --home:#C4256A; --home-ink:#FFFFFF; --home-bg:#FCEBF3;
  --pin:#191C26; --pin-ink:#FFFFFF;
  --map-bg:#F4F1EC00; --map-water:#CFE0EE; --map-land:#F6F5F1; --map-park:#DCE9D5;
  --map-road:#E7E4DE; --map-road-2:#D8D4CC; --map-coast:#A9C4D8;
  --shadow:0 1px 2px rgba(16,18,28,.05), 0 14px 34px -20px rgba(16,18,28,.34);
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-ja:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --hd-h:52px; --tab-h:52px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .mapbox.tiles.osmtiles #cv{filter:invert(1) hue-rotate(180deg) brightness(.88) contrast(1.04) saturate(.8)}
  :root:not([data-theme="light"]){
    --paper:#0C0E14; --card:#151822; --card-2:#1B1F2A; --sheet:#151822;
    --ink:#ECEEF4; --ink-2:#C2C7D6; --muted:#939AAC;
    --rule:#252935; --rule-2:#3A4150;
    --yellow:#F2C651; --yellow-line:#E0AE2E;
    --purple:#C08ED0; --purple-line:#A468B8;
    --red:#E88377; --red-line:#D2564A;
    --bus:#63C398; --bus-line:#3F9F78;
    --jr:#8FB6EE; --jr-line:#5A8FD8;
    --walk:#7D8498;
    --warn:#F2A87F; --warn-bg:#2C1B10; --warn-rule:#4A2E1E;
    --ok:#74D7A8; --ok-bg:#0E2A1D; --ok-rule:#1E4634;
    --home:#FF86B4; --home-ink:#14060D; --home-bg:#2A1220;
    --pin:#ECEEF4; --pin-ink:#0C0E14;
    --map-water:#16283A; --map-land:#101319; --map-park:#16261B;
    --map-road:#1E222C; --map-road-2:#272C38; --map-coast:#2A4459;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"] .mapbox.tiles.osmtiles #cv{filter:invert(1) hue-rotate(180deg) brightness(.88) contrast(1.04) saturate(.8)}
:root[data-theme="dark"]{
  --paper:#0C0E14; --card:#151822; --card-2:#1B1F2A; --sheet:#151822;
  --ink:#ECEEF4; --ink-2:#C2C7D6; --muted:#939AAC;
  --rule:#252935; --rule-2:#3A4150;
  --yellow:#F2C651; --yellow-line:#E0AE2E;
  --purple:#C08ED0; --purple-line:#A468B8;
  --red:#E88377; --red-line:#D2564A;
  --bus:#63C398; --bus-line:#3F9F78;
  --jr:#8FB6EE; --jr-line:#5A8FD8;
  --walk:#7D8498;
  --warn:#F2A87F; --warn-bg:#2C1B10; --warn-rule:#4A2E1E;
  --ok:#74D7A8; --ok-bg:#0E2A1D; --ok-rule:#1E4634;
  --home:#FF86B4; --home-ink:#14060D; --home-bg:#2A1220;
  --pin:#ECEEF4; --pin-ink:#0C0E14;
  --map-water:#16283A; --map-land:#101319; --map-park:#16261B;
  --map-road:#1E222C; --map-road-2:#272C38; --map-coast:#2A4459;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent; scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-sans); font-size:15.5px; line-height:1.6; -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
[hidden]{display:none !important}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.ja{font-family:var(--f-ja)}
a{color:inherit}
button{font:inherit; color:inherit}
:focus-visible{outline:2.5px solid var(--ink); outline-offset:2px; border-radius:8px}
.app{
  max-width:1320px; margin:0 auto;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}

/* ===== header ===== */
.hd{position:sticky; top:0; z-index:40; background:var(--paper); border-bottom:1px solid var(--rule)}
.hd-in{display:flex; align-items:center; gap:10px; padding:calc(9px + env(safe-area-inset-top)) 14px 9px; min-height:var(--hd-h)}
.leaf{font-size:20px; line-height:1}
.hd-t{min-width:0; flex:1}
h1{margin:0; font-size:16.5px; font-weight:700; letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hd-s{margin:1px 0 0; font-size:11.5px; color:var(--muted); letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dcount{
  flex:0 0 auto; font-size:11.5px; font-weight:600; color:var(--ink-2);
  background:var(--card); border:1.5px solid var(--rule-2); border-radius:999px; padding:4px 10px;
}

/* ===== day tabs ===== */
.days{
  position:sticky; top:var(--hd-h); z-index:39; display:flex; gap:7px;
  padding:8px 14px 9px; overflow-x:auto; background:var(--paper);
  border-bottom:1px solid var(--rule); scrollbar-width:none; scroll-snap-type:x proximity;
}
.days::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; display:flex; align-items:center; gap:7px; scroll-snap-align:center;
  background:var(--card); border:1.5px solid var(--rule); border-radius:999px;
  padding:7px 13px 7px 9px; min-height:38px; cursor:pointer; font-size:13.5px;
  transition:background .13s, border-color .13s, color .13s;
}
.tab .n{font-family:var(--f-mono); font-size:11.5px; font-weight:600; background:var(--card-2); border:1.5px solid var(--rule); border-radius:6px; padding:1px 6px}
.tab .ic{font-size:13px}
.tab .wd{color:var(--muted); font-size:12px; font-family:var(--f-mono)}
.tab[aria-selected="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.tab[aria-selected="true"] .n{background:transparent; border-color:currentColor; opacity:.72}
.tab[aria-selected="true"] .wd{color:inherit; opacity:.72}
.tab.info-tab{margin-left:auto}

/* ===== map ===== */
.mapwrap{
  position:relative; z-index:1;
  background:var(--card); border-bottom:1px solid var(--rule);
}
.mapbar{display:flex; align-items:center; gap:8px; padding:8px 12px 8px 14px; border-bottom:1px solid var(--rule); background:var(--card-2)}
.mapt{font-size:13.5px; font-weight:600; letter-spacing:-.02em; flex:1 1 0; min-width:30px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mapbtns{display:flex; gap:6px; flex:0 0 auto}
.mb{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:4px; background:var(--card); border:1.5px solid var(--rule-2);
  border-radius:9px; padding:5px 8px; min-height:32px; font-size:12px; font-weight:600; cursor:pointer; line-height:1;
}
.mb .lbl{display:none}
.mb:hover{border-color:var(--ink-2)}
.mb[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.mapbox{position:relative; height:clamp(230px,44dvh,460px); background:var(--map-land); overflow:hidden; touch-action:none}
.mapbox canvas{position:absolute; inset:0; display:block; width:100%; height:100%}
#cvTop{pointer-events:none}

.pins{position:absolute; inset:0; pointer-events:none}
.pin{
  position:absolute; transform:translate(-50%,-50%); pointer-events:auto;
  width:30px; height:30px; border-radius:50%; border:2.5px solid var(--map-land);
  background:var(--pin); color:var(--pin-ink); font-family:var(--f-mono); font-size:13.5px; font-weight:600;
  display:grid; place-items:center; cursor:pointer; padding:0; box-shadow:0 2px 6px rgba(0,0,0,.28);
}
.pin.home{border-radius:9px; background:var(--home); color:var(--home-ink)}
.pin.opt{background:var(--map-land); color:var(--ink); border:2.5px dashed var(--pin)}
.pin.sel{outline:3.5px solid var(--pin); outline-offset:2.5px; z-index:5}
.pin.sub{width:15px; height:15px; font-size:0; background:var(--card); border:3.5px solid var(--ink-2); box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pin.grouped::after{
  content:attr(data-more); position:absolute; top:-7px; right:-11px;
  font-family:var(--f-mono); font-size:9.5px; font-weight:600; line-height:1.5;
  background:var(--card); color:var(--ink-2); border:1.5px solid var(--rule-2);
  border-radius:7px; padding:0 4px; box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.pin.me{width:16px; height:16px; background:#2E7BE0; border:3px solid #fff; box-shadow:0 0 0 6px rgba(46,123,224,.22); cursor:default}
.zoomers{position:absolute; right:9px; top:9px; display:flex; flex-direction:column; gap:5px}
.zb{
  width:33px; height:33px; border-radius:9px; background:var(--card); border:1.5px solid var(--rule-2);
  font-size:17px; font-weight:600; cursor:pointer; display:grid; place-items:center; line-height:1;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.attr{
  position:absolute; right:6px; bottom:5px; margin:0; font-size:9.5px; color:var(--muted);
  background:color-mix(in srgb, var(--card) 78%, transparent); padding:1px 5px; border-radius:5px; letter-spacing:.01em;
}
.mapmsg{
  position:absolute; left:9px; bottom:9px; margin:0; max-width:62%; font-size:11px; color:var(--ink-2);
  background:color-mix(in srgb, var(--card) 88%, transparent); border:1px solid var(--rule);
  padding:5px 8px; border-radius:8px; line-height:1.4;
}
.legend{display:flex; flex-wrap:wrap; gap:5px 13px; padding:7px 14px 8px; background:var(--card-2); border-top:1px solid var(--rule)}
.legend::-webkit-scrollbar{display:none}
.lg{flex:0 0 auto; display:flex; align-items:center; gap:5px; white-space:nowrap; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-2)}
.lg i{display:block; width:19px; height:3.5px; border-radius:2px; background:currentColor}
.lg.l-y{color:var(--yellow)} .lg.l-p{color:var(--purple)} .lg.l-r{color:var(--red)}
.lg.l-b{color:var(--bus)} .lg.l-h{color:var(--home)}
.lg.l-w i{height:0; border-top:3.5px dashed var(--walk); border-radius:0}
.lg.l-h i{width:12px; height:12px; border-radius:4px}
.mapwrap.hid .mapbox, .mapwrap.hid .legend{display:none}
body.full .mapwrap{
  position:fixed; inset:0; z-index:80; border:0; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  background:var(--card);
}
body.full .mapbox{flex:1 1 auto; height:auto; max-height:none}
body.full{overflow:hidden}
body.full .mb#btnFull{background:var(--ink); color:var(--paper); border-color:var(--ink)}
body.full .legend{display:none}

/* ===== day body ===== */
main{padding:14px 14px 0; display:flex; flex-direction:column; gap:13px}
.card{background:var(--card); border:1.5px solid var(--rule); border-radius:15px; box-shadow:var(--shadow); overflow:hidden}
.dayhead{padding:14px 15px 15px}
.dayhead .eb{font-family:var(--f-mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.dayhead h2{margin:3px 0 0; font-size:20px; font-weight:700; letter-spacing:-.03em; text-wrap:balance}
.dayhead .spend{margin:7px 0 0; font-size:13px; color:var(--muted); font-family:var(--f-mono)}
.keys{display:flex; flex-direction:column; gap:6px; margin-top:12px}
.key{
  display:flex; gap:9px; align-items:baseline; font-size:13.5px; line-height:1.5; color:var(--ink-2);
  background:var(--warn-bg); border:1.5px solid var(--warn-rule); border-radius:10px; padding:8px 11px;
}
.key b{color:var(--warn); font-family:var(--f-mono); font-size:12px; font-weight:600; white-space:nowrap}

/* timeline */
.tl{list-style:none; margin:0; padding:0}
.tl > li{position:relative}
.stopbtn{
  display:grid; grid-template-columns:50px 28px minmax(0,1fr) 18px; gap:0 10px; align-items:start;
  width:100%; text-align:left; background:none; border:0; padding:13px 13px 13px 12px; cursor:pointer;
  border-top:1px solid var(--rule);
}
.tl > li:first-child .stopbtn{border-top:0}
.stopbtn:hover{background:var(--card-2)}
.stopbtn[aria-expanded="true"]{background:var(--card-2)}
.stopbtn .tm{font-family:var(--f-mono); font-size:12.5px; color:var(--muted); padding-top:5px; letter-spacing:-.03em}
.bd{
  width:28px; height:28px; border-radius:50%; background:var(--pin); color:var(--pin-ink);
  font-family:var(--f-mono); font-size:13.5px; font-weight:600; display:grid; place-items:center; margin-top:2px;
}
.stopbtn.home .bd{border-radius:8px; background:var(--home); color:var(--home-ink)}
.stopbtn.opt .bd{background:transparent; color:var(--ink-2); border:2px dashed var(--rule-2)}
.stopbtn.transit .bd{background:transparent; color:var(--muted); border:2px dashed var(--rule-2); font-size:12px}
.stopbtn .nm{display:block; font-size:15.5px; font-weight:600; letter-spacing:-.02em; line-height:1.4; overflow-wrap:anywhere}
.stopbtn.transit .nm{font-weight:500; color:var(--ink-2); font-size:14.5px}
.stopbtn .jp{display:block; font-family:var(--f-ja); font-size:11.5px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere}
.stopbtn .nt{display:block; font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45}
.stopbtn .cv{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
.stopbtn .caret{font-size:11px; color:var(--muted); padding-top:7px; transition:transform .16s}
.stopbtn[aria-expanded="true"] .caret{transform:rotate(180deg)}
.stopbtn.sel::before{content:""; position:absolute; left:0; top:6px; bottom:6px; width:3.5px; background:var(--pin); border-radius:0 4px 4px 0}
.stopbtn.home.sel::before{background:var(--home)}
.badge-home{
  margin-left:6px; font-family:var(--f-mono); font-size:9.5px; font-weight:600; vertical-align:2px;
  color:var(--home); background:var(--home-bg); border:1.5px solid var(--home); border-radius:5px; padding:0 5px;
}

.chip{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--f-mono); font-size:10.5px;
  padding:2px 8px; border-radius:999px; border:1.5px solid var(--rule-2); color:var(--ink-2); white-space:nowrap;
}
.chip.c-purple{border-color:var(--purple); color:var(--purple)}
.chip.c-yellow{border-color:var(--yellow); color:var(--yellow)}
.chip.c-red{border-color:var(--red); color:var(--red)}
.chip.c-bus{border-color:var(--bus); color:var(--bus)}
.chip.c-jr{border-color:var(--jr); color:var(--jr)}
.chip.c-walk{border-color:var(--walk); color:var(--walk); border-style:dashed}
.chip.cat{border-color:var(--rule-2); color:var(--muted)}

/* detail */
.det{padding:2px 13px 16px 12px; background:var(--card-2); border-top:1px dashed var(--rule)}
.det > .sec{padding-top:13px}
.det .lb{display:block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:7px}
.route{display:flex; flex-wrap:wrap; align-items:center; gap:5px}
.rp{font-size:12.5px; font-weight:600; background:var(--card); border:1.5px solid var(--rule-2); border-radius:8px; padding:4px 9px}
.rm{display:inline-flex; align-items:center; gap:5px; font-family:var(--f-mono); font-size:10.5px; color:var(--muted)}
.rm i{display:block; width:15px; height:3.5px; border-radius:2px; background:var(--rule-2)}
.rm.m-purple i{background:var(--purple-line)} .rm.m-purple{color:var(--purple)}
.rm.m-yellow i{background:var(--yellow-line)} .rm.m-yellow{color:var(--yellow)}
.rm.m-red i{background:var(--red-line)} .rm.m-red{color:var(--red)}
.rm.m-bus i{background:var(--bus-line)} .rm.m-bus{color:var(--bus)}
.rm.m-jr i{background:var(--jr-line)} .rm.m-jr{color:var(--jr)}
.rm.m-walk i{height:0; border-top:3.5px dashed var(--walk); background:none}
dl.facts{margin:0; display:grid; grid-template-columns:minmax(0,1fr); gap:2px 0; font-size:13.5px}
dl.facts dt{font-family:var(--f-mono); font-size:11px; color:var(--muted); padding-top:6px}
dl.facts dt:first-of-type{padding-top:0}
dl.facts dd{margin:0; color:var(--ink-2); overflow-wrap:anywhere}
.callout{display:flex; gap:8px; font-size:13px; line-height:1.55; color:var(--ink-2); background:var(--warn-bg); border:1.5px solid var(--warn-rule); border-radius:10px; padding:10px 12px}
.callout.plan{background:var(--ok-bg); border-color:var(--ok-rule)}
.callout b{color:var(--warn); font-weight:600}
.callout.plan b{color:var(--ok)}
ul.tips{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px}
ul.tips li{position:relative; padding-left:15px; font-size:13.5px; color:var(--ink-2); line-height:1.55}
ul.tips li::before{content:""; position:absolute; left:2px; top:9px; width:5px; height:5px; border-radius:50%; background:var(--rule-2)}
ol.alts{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; counter-reset:alt}
ol.alts li{
  position:relative; padding:10px 12px 10px 34px; font-size:13.5px; color:var(--ink-2); line-height:1.5;
  background:var(--card); border:1.5px solid var(--rule); border-left:3px solid var(--ok); border-radius:10px;
}
ol.alts li::before{
  counter-increment:alt; content:counter(alt); position:absolute; left:10px; top:10px;
  width:18px; height:18px; border-radius:6px; background:var(--ok-bg); color:var(--ok); border:1.5px solid var(--ok);
  font-family:var(--f-mono); font-size:10.5px; font-weight:600; display:grid; place-items:center;
}
.lb.alt{color:var(--ok)}
ul.subs{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
ul.subs li{border:1.5px solid var(--rule); border-radius:11px; padding:10px 12px; background:var(--card)}
ul.subs li.star{border-left:3px solid var(--ink)}
ul.subs .sn{font-size:14px; font-weight:600; letter-spacing:-.02em; display:flex; gap:6px; align-items:baseline; flex-wrap:wrap}
ul.subs .sj{font-family:var(--f-ja); font-size:11.5px; color:var(--muted); margin-top:2px}
ul.subs .sd{font-size:13px; color:var(--ink-2); margin-top:5px; line-height:1.5}
ul.subs .sub-n{font-family:var(--f-mono); font-size:10.5px; color:var(--muted); border:1.5px solid var(--rule-2); border-radius:5px; padding:0 5px}
.acts{display:flex; flex-wrap:wrap; gap:7px}
.gmap{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; text-decoration:none;
  background:var(--ink); color:var(--paper); border-radius:10px; padding:10px 14px; min-height:42px;
  font-size:13.5px; font-weight:600; letter-spacing:-.02em; flex:1 1 auto;
}
.gmap.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--rule-2); font-weight:500}
.gmap .ar{font-family:var(--f-mono); font-size:11px; opacity:.65}
a.tel{display:inline-flex; align-items:center; gap:3px; text-decoration:none; color:var(--ink); font-weight:600; border-bottom:1.5px solid var(--rule-2); white-space:nowrap}
.drop{padding:13px 15px 15px}
.drop .lb{display:block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:7px}
.drop p{margin:0; font-size:13.5px; color:var(--ink-2); line-height:1.6}

/* ===== info ===== */
#infoPane{padding:14px 14px 0; display:grid; gap:13px}
#infoPane .info{display:contents}
#infoPane .card > h3{margin:0; padding:13px 15px 11px; font-size:15.5px; font-weight:700; letter-spacing:-.025em; border-bottom:1.5px solid var(--rule); background:var(--card-2)}
#infoPane .body{padding:14px 15px}
#infoPane .body > *:first-child{margin-top:0}
#infoPane .body > *:last-child{margin-bottom:0}
table.tt{width:100%; border-collapse:collapse; font-size:13.5px}
table.tt th{text-align:left; font-family:var(--f-mono); font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-weight:500; padding:0 14px 10px 0; border-bottom:1px solid var(--rule-2)}
table.tt td{padding:12px 14px 12px 0; border-bottom:1px solid var(--rule); vertical-align:top; color:var(--ink-2); line-height:1.55; overflow-wrap:anywhere}
table.tt th:last-child, table.tt td:last-child{padding-right:0}
table.tt tr:first-child td{padding-top:0}
table.tt thead + tbody tr:first-child td{padding-top:12px}
table.tt tr:last-child td{border-bottom:0; padding-bottom:0}
table.tt td b{color:var(--ink); font-weight:600}
ul.check{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; font-size:14px}
ul.check li{display:flex; gap:10px; align-items:flex-start; color:var(--ink-2); line-height:1.5}
ul.check .bx{flex:0 0 auto; width:20px; height:20px; border-radius:6px; border:2px solid var(--rule-2); margin-top:2px; display:grid; place-items:center; font-size:11px; color:var(--muted)}
ul.check li.done .bx{background:var(--ink); border-color:var(--ink); color:var(--paper)}
ul.check li.done{color:var(--muted)}

.fab{
  position:fixed; right:14px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:50;
  display:none; align-items:center; gap:7px; padding:11px 15px; min-height:46px;
  background:var(--ink); color:var(--paper); border:0; border-radius:999px;
  font-size:14px; font-weight:600; letter-spacing:-.02em; cursor:pointer;
  box-shadow:0 4px 16px rgba(16,18,28,.28);
}
.fab.show{display:inline-flex}
body.full .fab{display:none !important}
.fsheet{
  position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:90;
  display:flex; flex-direction:column; gap:9px;
  background:var(--card); border:1.5px solid var(--rule-2); border-radius:14px;
  padding:12px 14px; box-shadow:0 10px 30px rgba(0,0,0,.34);
}
.fsheet .fs-t{font-size:15px; font-weight:600; letter-spacing:-.02em; line-height:1.4}
.fsheet .fs-b{display:flex; gap:8px}
.fsheet .fs-g, .fsheet .fs-x{
  flex:1 1 0; display:inline-flex; align-items:center; justify-content:center; min-height:42px;
  border-radius:10px; font-size:13.5px; font-weight:600; text-decoration:none; cursor:pointer;
}
.fsheet .fs-g{background:transparent; color:var(--ink); border:1.5px solid var(--rule-2)}
.fsheet .fs-x{background:var(--ink); color:var(--paper); border:0}
.ft{margin:26px 14px 0; padding-top:16px; border-top:1px solid var(--rule); display:flex; flex-direction:column; gap:5px; font-size:11.5px; color:var(--muted)}

/* mobile stacked tables */
@media (max-width:640px){
  table.tt td[style]{width:34% !important; min-width:70px}
  table.tt.stack thead{display:none}
  table.tt.stack, table.tt.stack tbody, table.tt.stack tr, table.tt.stack td{display:block; width:auto !important}
  table.tt.stack tr{padding:13px 0; border-bottom:1px solid var(--rule)}
  table.tt.stack tr:first-child{padding-top:0}
  table.tt.stack tr:last-child{border-bottom:0; padding-bottom:0}
  table.tt.stack td{border-bottom:0; padding:0 0 7px !important; min-width:0 !important}
  table.tt.stack td:last-child{padding-bottom:0 !important}
  table.tt.stack td:first-child{font-family:var(--f-mono); font-size:12px; letter-spacing:.04em; color:var(--muted)}
  table.tt.stack td:nth-child(2){font-size:14.5px; color:var(--ink)}
}

/* ===== desktop ===== */
@media (min-width:1000px){
  :root{--hd-h:60px}
  .fab, .fsheet{display:none !important}
  .hd-in{padding:12px 22px}
  h1{font-size:21px}
  .hd-s{font-size:12.5px}
  .days{padding:10px 22px 11px; gap:9px}
  .tab{font-size:14px; min-height:42px; padding:8px 15px 8px 11px}
  .mb .lbl{display:inline}
  .app{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr); grid-template-areas:"hd hd" "tabs tabs" "map main" "ft ft"; gap:0 20px; padding:0 22px 40px}
  .hd{grid-area:hd; margin:0 -22px; padding:0 22px}
  .days{grid-area:tabs; margin:0 -22px; padding-left:22px; padding-right:22px}
  .mapwrap{grid-area:map; position:sticky; top:calc(var(--hd-h) + var(--tab-h) + 16px); margin-top:16px; border:1.5px solid var(--rule); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; height:calc(100dvh - var(--hd-h) - var(--tab-h) - 48px)}
  .mapwrap .mapbox{height:auto; flex:1 1 auto}
  .mapwrap{display:flex; flex-direction:column}
  main, #infoPane{grid-area:main; padding:16px 0 0}
  #infoPane{grid-template-columns:minmax(0,1fr)}
  .ft{grid-area:ft; margin-left:0; margin-right:0; flex-direction:row; flex-wrap:wrap; gap:8px 20px}
  .app.info-mode{grid-template-columns:minmax(0,1fr); grid-template-areas:"hd" "tabs" "main" "ft"}
  .app.info-mode .mapwrap{display:none}
  .app.info-mode #infoPane{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); align-items:start}
  .app.info-mode #infoPane .wide{grid-column:1/-1}
  dl.facts{grid-template-columns:minmax(0,auto) minmax(0,1fr); gap:8px 14px}
  dl.facts dt{white-space:nowrap; padding-top:3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important; scroll-behavior:auto !important}}

/* ============================================================
   미니 슬리피 맵 — OpenStreetMap 타일(가능할 때) + 내장 OSM 벡터(항상)
   외부 라이브러리 0개. 캔버스 렌더 + DOM 핀 오버레이.
   ============================================================ */
const MiniMap = (() => {
  const TS = 256, D2R = Math.PI / 180;
  const px = (lng) => (lng + 180) / 360 * TS;
  const py = (lat) => {
    const s = Math.min(0.9999, Math.max(-0.9999, Math.sin(lat * D2R)));
    return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * TS;
  };
  const unpx = (x) => x / TS * 360 - 180;
  const unpy = (y) => {
    const n = Math.PI - 2 * Math.PI * y / TS;
    return Math.atan(Math.sinh(n)) / D2R;
  };
  /* google encoded polyline → [[lat,lng],…] */
  function decode(str) {
    const out = []; let i = 0, lat = 0, lng = 0;
    while (i < str.length) {
      let r = 0, sh = 0, b;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
      lat += (r & 1) ? ~(r >> 1) : (r >> 1);
      r = 0; sh = 0;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
      lng += (r & 1) ? ~(r >> 1) : (r >> 1);
      out.push([lat / 1e5, lng / 1e5]);
    }
    return out;
  }
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  class Map2 {
    constructor(canvas, box, basemap, opts = {}) {
      this.cv = canvas; this.box = box; this.ctx = canvas.getContext('2d');
      this.cv2 = opts.top || null; this.ctx2 = this.cv2 ? this.cv2.getContext('2d') : null;
      this.lat = 35.168; this.lng = 136.906; this.z = 13;
      this.minZ = 5; this.maxZ = 18;
      this.tiles = new Map(); this.tileMode = false; this.probed = false;
      this.style = opts.style || 'clean';   /* clean = 라벨 없는 CARTO, osm = 일본어 상세 */
      this.labels = [];
      this.overlay = []; this.onView = opts.onView || (() => {});
      this.onTileState = opts.onTileState || (() => {});
      this.base = this.prep(basemap);
      this.pointers = new Map(); this.pinchStart = null;
      this.bind();
      this.resize();
      this.probe();
    }
    /* 내장 벡터 데이터 → 투영 좌표 + bbox 캐시 */
    prep(bm) {
      const conv = (encList) => encList.map(e => {
        const pts = decode(e); const p = new Float64Array(pts.length * 2);
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        for (let i = 0; i < pts.length; i++) {
          const X = px(pts[i][1]), Y = py(pts[i][0]);
          p[i * 2] = X; p[i * 2 + 1] = Y;
          if (X < x0) x0 = X; if (X > x1) x1 = X; if (Y < y0) y0 = Y; if (Y > y1) y1 = Y;
        }
        return { p, b: [x0, y0, x1, y1] };
      });
      return {
        water: conv(bm.water), river: conv(bm.river), road: conv(bm.road),
        coast: conv(bm.coast), briver: conv(bm.briver),
        park: conv(bm.park.map(o => o.p)),
        rail: bm.rail.map(r => ({ n: r.n, c: r.c, i: r.i, s: conv(r.p) })),
        railLL: bm.rail.map(r => ({ n: r.n, c: r.c, s: r.p.map(decode) }))
      };
    }
    /* ---------- 뷰 ---------- */
    resize() {
      const r = this.box.getBoundingClientRect();
      this.w = Math.max(80, r.width); this.h = Math.max(80, r.height);
      const dpr = Math.min(3, window.devicePixelRatio || 1);   /* 아이폰 레티나(dpr 3) 그대로 */
      for (const c of [this.cv, this.cv2]) {
        if (!c) continue;
        c.width = Math.round(this.w * dpr); c.height = Math.round(this.h * dpr);
        c.style.width = this.w + 'px'; c.style.height = this.h + 'px';
      }
      this.dpr = dpr; this.draw();
    }
    scale() { return Math.pow(2, this.z); }
    project(lat, lng) {
      const s = this.scale();
      return [(px(lng) - px(this.lng)) * s + this.w / 2, (py(lat) - py(this.lat)) * s + this.h / 2];
    }

    yellow: ['히가시야마선'], purple: ['메이조선', '메이코선'],
    red: ['뮤스카이', '이누야마선', '공항선', '도코나메선', '나고야본선'], jr: ['JR']
  };
  const HUBS = ['카나야마', '메이테츠 나고야', '나고야', '사카에'];
  const START = new Date(2026, 9, 21);

  const P = COORDS.P, S = COORDS.S;
  const llOf = (st) => (st.q && P[st.q]) || null;
  function nodeLL(token, st) {
    if (!token) return null;
    if (S[token]) return S[token];
    if (P[token]) return P[token];
    const me = llOf(st);
    if (me && (st.name.indexOf(token) >= 0 || token.indexOf(st.name) >= 0)) return me;
    return null;
  }

  /* ---------- 지도 ---------- */
  const mapbox = $('#mapbox'), cv = $('#cv'), pinsEl = $('#pins'), msgEl = $('#mapmsg');
  const map = new MiniMap.Map(cv, mapbox, BASEMAP, {
    top: $('#cvTop'),
    onView: () => placePins(),
    onTileState: (ok) => {
      mapbox.classList.toggle('tiles', ok);
      mapbox.classList.toggle('osmtiles', map.style === 'osm');
      msgEl.hidden = ok;
      if (!ok) msgEl.innerHTML = '타일 서버를 못 불러와서 <b>내장 OSM 벡터 지도</b>로 그렸어 — 노선·물·공원은 실제 좌표야.';
      setAttr(ok);
    }
  });

  let dayIdx = 0, stopIdx = -1, mePin = null, meLL = null;

  /* ---------- 한글 라벨: 우리가 쓰는 역 + 동네 ---------- */
  const ST_LABELS = [
    ['사카에', '--purple-line'], ['나고야', '--yellow-line'], ['야바초', '--purple-line'],
    ['카미마에즈', '--purple-line'], ['카나야마', '--purple-line'], ['나고야조', '--purple-line'],
    ['후시미', '--yellow-line'], ['카메지마', '--yellow-line'], ['히가시야마코엔', '--yellow-line'],
    ['산노', '--red-line'], ['나고야코', '--purple-line'], ['이누야마', '--red-line']
  ];
  const AREAS = [
    ['오스 상점가', 35.1588, 136.9008], ['니시키 밤거리', 35.1716, 136.9048],
    ['나고야역 서쪽', 35.1700, 136.8785], ['히사야오도리', 35.1745, 136.9088],
    ['시라카와고 마을', 36.2585, 136.9048], ['이누야마 성하마을', 35.3856, 136.9412]
  ];
  map.labels = ST_LABELS.filter(x => S[x[0]]).map(x => ({ ll: S[x[0]], t: x[0], k: 'st', c: x[1] }))
    .concat(AREAS.map(x => ({ ll: [x[1], x[2]], t: x[0], k: 'area' })));

  const JP = {
    '사카에': '栄駅 名古屋', '나고야': '名古屋駅', '야바초': '矢場町駅', '카미마에즈': '上前津駅',
    '카나야마': '金山駅 名古屋', '나고야조': '名古屋城駅', '후시미': '伏見駅 名古屋', '카메지마': '亀島駅',
    '히가시야마코엔': '東山公園駅', '산노': '山王駅 名鉄', '나고야코': '名古屋港駅', '이누야마': '犬山駅',
    '오스 상점가': '大須商店街', '니시키 밤거리': '名古屋市中区錦三丁目', '나고야역 서쪽': '名古屋駅 太閤通口',
    '히사야오도리': '久屋大通公園', '시라카와고 마을': '白川郷', '이누야마 성하마을': '犬山城下町'
  };
  function setAttr(ok) {
    const osm = '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 기여자';
    $('#attr').innerHTML = !ok ? ('OSM 데이터 내장 · © ' + osm)
      : map.style === 'osm' ? ('지도 © ' + osm)
      : ('지도 © ' + osm + ' · 타일 © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>');
  }

  /* ---------- 하루 동선 → 지도 선 ---------- */
  function dayOverlay(day) {
    const segs = [], seen = new Set();
    for (const st of day.stops) {
      if (!st.route) continue;
      const r = st.route;
      for (let i = 1; i < r.length; i += 2) {
        const parts = String(r[i]).split('|');
        const mode = parts[1] || 'walk';
        const A = nodeLL(r[i - 1], st), B = nodeLL(r[i + 1], st);
        if (!A || !B || (A[0] === B[0] && A[1] === B[1])) continue;
        const key = mode + A.join() + B.join();
        if (seen.has(key)) continue;
        seen.add(key);
        let pts = null;
        if (RAILN[mode]) pts = map.railPath(RAILN[mode], A, B, HUBS.map(h => S[h]).filter(Boolean));
        if (pts && pts.length > 1) {
          segs.push({ pts, v: MODEV[mode], dash: false });
          segs.push({ pts: [A, pts[0]], v: '--walk', dash: true });
          segs.push({ pts: [pts[pts.length - 1], B], v: '--walk', dash: true });
        } else {
          segs.push({ pts: [A, B], v: MODEV[mode] || '--walk', dash: mode === 'walk' || mode === 'bus' || !RAILN[mode] });
        }
      }
    }
    return segs;
  }

  /* ---------- 핀 ---------- */
  let pinData = [];
  function buildPins(day) {
    pinsEl.innerHTML = '';
    pinData = [];
    day.stops.forEach((st, i) => {
      const ll = llOf(st);
      if (!ll) return;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pin' + (st.home ? ' home' : '') + (st.opt ? ' opt' : '');
      b.textContent = String(i + 1);
      b.setAttribute('aria-label', (i + 1) + '. ' + st.name);
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const me = pinData.find(p => p.el === b);
        if (me && me.gz) { map.zoomTo(map.z + 1.7, me.gz[0], me.gz[1]); placePins(); return; }
        selectStop(i, true);
      });
      pinsEl.appendChild(b);
      pinData.push({ el: b, ll, i });
    });
    if (mePin) pinsEl.appendChild(mePin);
    placePins();
    map.draw();
  }
  function subPins(st) {
    if (!st || !st.subs) return;
    st.subs.forEach((s) => {
      const ll = s.q && P[s.q];
      if (!ll) return;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pin sub';
      b.textContent = '·';
      b.title = s.n;
      b.setAttribute('aria-label', s.n);
      b.addEventListener('click', (e) => { e.stopPropagation(); window.open(gmap(s.q), '_blank', 'noopener'); });
      pinsEl.appendChild(b);
      pinData.push({ el: b, ll, sub: true });
    });
  }
  function placePins() {
    const pad = 6;
    map.avoid = pinData.map(p => [p.ll[0], p.ll[1], p.sub ? 10 : 17]);
    /* 1) 화면 좌표 계산 + 화면 밖 숨김 */
    const vis = [];
    for (const p of pinData) {
      const xy = map.project(p.ll[0], p.ll[1]);
      const on = xy[0] > -pad && xy[0] < map.w + pad && xy[1] > -pad && xy[1] < map.h + pad;
      p.el.style.display = on ? '' : 'none';
      p.el.classList.remove('grouped');
      p.el.removeAttribute('data-more');
      p.gz = null;
      if (on) { p.x = xy[0]; p.y = xy[1]; vis.push(p); }
    }
    /* 2) 가까운 핀은 하나로 묶어서 보여준다 (탭하면 확대) */
    const groups = [];
    for (const p of vis) {
      const near = groups.find(g => Math.hypot(g.x - p.x, g.y - p.y) < (p.sub || g.sub ? 15 : 27));
      if (near) { near.m.push(p); near.sub = near.sub && p.sub; }
      else groups.push({ x: p.x, y: p.y, m: [p], sub: !!p.sub });
    }
    /* 3) 대표 핀만 남기고, 겹친 서브 핀은 살짝 밀어서 표시 */
    for (const g of groups) {
      const sel = g.m.find(p => !p.sub && p.i === stopIdx);
      const rep = sel || g.m.find(p => !p.sub) || g.m[0];
      const rest = g.m.filter(p => p !== rep);
      rep.el.style.left = g.x + 'px'; rep.el.style.top = g.y + 'px';
      const hidden = rest.filter(p => !p.sub).length;
      if (hidden > 0) {
        rep.el.classList.add('grouped');
        rep.el.setAttribute('data-more', '+' + hidden);
        rep.gz = [g.x, g.y];
        rep.el.setAttribute('aria-label', '이 자리에 ' + g.m.length + '곳 — 눌러서 확대');
      }
      for (const p of rest) {
        if (p.sub) { /* 서브 핀은 작으니 6px만 밀어서 남겨둔다 */
          p.el.style.left = (g.x + 9) + 'px'; p.el.style.top = (g.y + 9) + 'px';
        } else p.el.style.display = 'none';
      }
    }
    if (mePin && meLL) {
      const xy = map.project(meLL[0], meLL[1]);
      mePin.style.left = xy[0] + 'px'; mePin.style.top = xy[1] + 'px';
    }
  }

  /* ---------- 탭 ---------- */
  const tabsEl = $('#tabs');
  function renderTabs() {
    tabsEl.innerHTML = '';
    DAYS.forEach((d, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.role = 'tab';
      b.setAttribute('aria-selected', i === dayIdx && dayIdx >= 0 ? 'true' : 'false');
      b.innerHTML = '<span class="n">D' + d.d + '</span><span class="ic">' + d.icon + '</span><span class="wd">' + esc(d.date) + '</span>';
      b.addEventListener('click', () => selectDay(i));
      tabsEl.appendChild(b);
    });
    const inf = document.createElement('button');
    inf.type = 'button'; inf.className = 'tab info-tab'; inf.role = 'tab';
    inf.setAttribute('aria-selected', dayIdx < 0 ? 'true' : 'false');
    inf.innerHTML = '<span class="ic">🧷</span><span>기본 정보</span>';
    inf.addEventListener('click', () => selectDay(-1));
    tabsEl.appendChild(inf);
  }

  /* ---------- 하루 렌더 ---------- */
  const main = $('#main'), infoPane = $('#infoPane'), app = $('.app');
  function chipsFor(st) {
    const out = [];
    if (st.cat) out.push('<span class="chip cat">' + esc(st.cat) + '</span>');
    const modes = new Set();
    (st.route || []).forEach((t, i) => { if (i % 2 === 1) { const m = String(t).split('|')[1]; if (m) modes.add(m); } });
    modes.forEach(m => out.push('<span class="chip c-' + m + '">' + (MODEL[m] || m).split(' ')[0] + '</span>'));
    return out.join('');
  }
  function routeHTML(r) {
    let h = '<div class="route">';
    r.forEach((t, i) => {
      if (i % 2 === 0) h += '<span class="rp">' + esc(t) + '</span>';
      else {
        const p = String(t).split('|');
        h += '<span class="rm m-' + (p[1] || 'walk') + '"><i></i>' + esc(p[0]) + '</span>';
      }
    });
    return h + '</div>';
  }
  function detailHTML(st, prev) {
    let h = '<div class="det">';
    if (st.route) h += '<div class="sec"><span class="lb">가는 길</span>' + routeHTML(st.route) + '</div>';
    if (st.warn) h += '<div class="sec"><div class="callout"><span aria-hidden="true">⚠️</span><span><b>주의</b> ' + tel(st.warn) + '</span></div></div>';
    if (st.facts) {
      h += '<div class="sec"><span class="lb">정보</span><dl class="facts">';
      st.facts.forEach(f => { h += '<dt>' + esc(f[0]) + '</dt><dd>' + tel(f[1]) + '</dd>'; });
      h += '</dl></div>';
    }
    if (st.subs) {
      h += '<div class="sec"><span class="lb">안에서 들를 곳</span><ul class="subs">';
      st.subs.forEach(s => {
        h += '<li' + (s.star ? ' class="star"' : '') + '><div class="sn">' + esc(s.n) + (s.star ? '<span class="sub-n">핵심</span>' : '') + '</div>' +
          '<div class="sj ja">' + esc(s.j || '') + '</div><div class="sd">' + tel(s.d || '') + '</div>' +
          (s.q ? '<div class="acts" style="margin-top:8px"><a class="gmap ghost" href="' + gmap(s.q) + '" target="_blank" rel="noopener">구글맵 <span class="ar">↗</span></a></div>' : '') + '</li>';
      });
      h += '</ul></div>';
    }
    if (st.tips) {
      h += '<div class="sec"><span class="lb">팁</span><ul class="tips">';
      st.tips.forEach(t => h += '<li>' + tel(t) + '</li>');
      h += '</ul></div>';
    }
    if (st.alts) {
      h += '<div class="sec"><span class="lb alt">밀렸을 때 — 플랜 B</span><ol class="alts">';
      st.alts.forEach(t => h += '<li>' + tel(t) + '</li>');
      h += '</ol></div>';
    }
    if (st.q) {
      const modes = new Set();
      (st.route || []).forEach((t, i) => { if (i % 2 === 1) { const m = String(t).split('|')[1]; if (m) modes.add(m); } });
      const tm = (modes.size === 1 && modes.has('walk')) ? 'walking' : 'transit';
      const from = prev && prev.q;
      h += '<div class="sec"><div class="acts">' +
        '<a class="gmap" href="' + gmap(st.q) + '" target="_blank" rel="noopener">구글맵에서 열기 <span class="ar">↗</span></a>' +
        (from ? '<a class="gmap ghost" href="' + gdir(from, st.q, tm) + '" target="_blank" rel="noopener">여기까지 길찾기 <span class="ar">↗</span></a>' : '') +
        '<button type="button" class="gmap ghost js-showmap">지도에서 보기 🗺</button>' +
        '</div></div>';
    }
    return h + '</div>';
  }
  function renderDay(i) {
    const d = DAYS[i];
    main.innerHTML = '';
    const head = document.createElement('section');
    head.className = 'card dayhead';
    head.innerHTML = '<span class="eb">Day ' + d.d + ' · ' + esc(d.date) + '</span><h2>' + esc(d.theme) + '</h2>' +
      (d.spend ? '<p class="spend">' + esc(d.spend) + '</p>' : '') +
      (d.keys ? '<div class="keys">' + d.keys.map(k => '<div class="key"><b>' + esc(k[0]) + '</b><span>' + tel(k[1]) + '</span></div>').join('') + '</div>' : '');
    main.appendChild(head);

    const list = document.createElement('section');
    list.className = 'card';
    const ol = document.createElement('ol');
    ol.className = 'tl';
    d.stops.forEach((st, si) => {
      const li = document.createElement('li');
      const prev = si > 0 ? d.stops[si - 1] : null;
      const cls = ['stopbtn', st.home ? 'home' : '', st.opt ? 'opt' : '', st.transit ? 'transit' : ''].filter(Boolean).join(' ');
      li.innerHTML = '<button type="button" class="' + cls + '" aria-expanded="false">' +
        '<span class="tm">' + esc(st.t) + '</span>' +
        '<span class="bd">' + (st.transit ? '↓' : (si + 1)) + '</span>' +
        '<span><span class="nm">' + esc(st.name) + (st.home ? '<span class="badge-home">🏨 베이스</span>' : '') + '</span>' +
        (st.ja ? '<span class="jp">' + esc(st.ja) + '</span>' : '') +
        (st.note ? '<span class="nt">' + tel(st.note) + '</span>' : '') +
        '<span class="cv">' + chipsFor(st) + '</span></span>' +
        '<span class="caret" aria-hidden="true">▾</span></button>' +
        '<div class="detwrap" hidden>' + detailHTML(st, prev) + '</div>';
      const btn = li.querySelector('.stopbtn');
      btn.addEventListener('click', () => selectStop(si, false));
      const smap = li.querySelector('.js-showmap');
      if (smap) smap.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const ll = llOf(st);
        setFull(true);
        if (ll) map.setView(ll[0], ll[1], Math.max(map.z, 16));
        stopIdx = si;
        pinData.forEach(p => p.el.classList.toggle('sel', p.i === si));
        placePins();
        showSheet(st);
      });
      ol.appendChild(li);
    });
    list.appendChild(ol);
    main.appendChild(list);

    if (d.drop) {
      const dr = document.createElement('section');
      dr.className = 'card drop';
      dr.innerHTML = '<span class="lb">밀리면 이 순서로 버려</span><p>' + tel(d.drop) + '</p>';
      main.appendChild(dr);
    }

    /* 지도 */
    $('#mapTitle').textContent = 'Day ' + d.d + ' 동선 · ' + d.theme;
    map.overlay = dayOverlay(d);
    buildPins(d);
    fitDay(d, false);
    renderLegend(d, farCount(d) > 0);
  }
  /* 시내 클러스터에서 멀리 떨어진 지점(공항·시라카와고 등) 수 */
  const KM = (a, b) => Math.hypot((a[0] - b[0]) * 111.3, (a[1] - b[1]) * 91.2);
  const FITPAD = { t: 48, r: 56, b: 38, l: 34 };
  function cluster(d) {
    const pts = d.stops.map(llOf).filter(Boolean);
    if (pts.length < 3) return { core: pts, far: [] };
    const mid = (arr) => arr.slice().sort((x, y) => x - y)[Math.floor(arr.length / 2)];
    const c = [mid(pts.map(p => p[0])), mid(pts.map(p => p[1]))];
    const core = pts.filter(p => KM(p, c) < 5), far = pts.filter(p => KM(p, c) >= 5);
    return { core: core.length > 1 ? core : pts, far };
  }
  function farCount(d) { return cluster(d).far.length; }
  function fitDay(d, all) {
    const pts = d.stops.map(llOf).filter(Boolean);
    map.fit(all ? pts : cluster(d).core, FITPAD);
  }

  function renderLegend(d, hasFar) {
    const modes = new Set();
    d.stops.forEach(st => (st.route || []).forEach((t, i) => { if (i % 2 === 1) { const m = String(t).split('|')[1]; if (m) modes.add(m); } }));
    let h = '';
    ['yellow', 'purple', 'red', 'bus', 'walk'].forEach(m => {
      if (!modes.has(m)) return;
      h += '<span class="lg l-' + m[0] + '"><i></i>' + MODEL[m] + '</span>';
    });
    h += '<span class="lg l-h"><i></i>🏨 호텔</span>';
    if (hasFar) h += '<span class="lg" style="color:var(--muted)">⤢ 전체 = 공항·근교까지</span>';
    $('#legend').innerHTML = h;
  }

  function selectStop(si, fromPin) {
    const d = DAYS[dayIdx];
    const items = main.querySelectorAll('.tl > li');
    items.forEach((li, i) => {
      const btn = li.querySelector('.stopbtn'), wrap = li.querySelector('.detwrap');
      const on = i === si && !(stopIdx === si && !fromPin);
      btn.setAttribute('aria-expanded', on ? 'true' : 'false');
      btn.classList.toggle('sel', on);
      wrap.hidden = !on;
    });
    const closing = stopIdx === si && !fromPin;
    stopIdx = closing ? -1 : si;
    if (closing) fsheet.hidden = true;
    pinData.forEach(p => p.el.classList.toggle('sel', !closing && p.i === si));
    if (!closing) {
      const st = d.stops[si], ll = llOf(st);
      /* 서브 핀 갱신 */
      pinData = pinData.filter(p => { if (p.sub) { p.el.remove(); return false; } return true; });
      subPins(st);
      if (ll) map.setView(ll[0], ll[1], Math.max(map.z, 15.4));
      placePins();
      if (fromPin) {
        if (isFull()) showSheet(st);
        else scrollToStop(si);
      } else if (isFull()) showSheet(st);
    }
  }

  function selectDay(i) {
    dayIdx = i; stopIdx = -1;
    renderTabs();
    if (i < 0) {
      main.hidden = true; infoPane.hidden = false;
      app.classList.add('info-mode');
      infoPane.innerHTML = tel(INFO);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    main.hidden = false; infoPane.hidden = true;
    app.classList.remove('info-mode');
    fitAll = false;
    $('#btnFit').setAttribute('aria-pressed', 'false');
    renderDay(i);
    if (window.scrollY > 40) window.scrollTo({ top: 0, behavior: 'smooth' });
    fabSync();
    requestAnimationFrame(() => map.resize());
  }

  /* 지도 위의 역·동네 점을 누르면 그 자리로 이동 */
  map.onTap = (x, y) => {
    const L = map.hitLabel(x, y);
    if (!L) return;
    map.setView(L.ll[0], L.ll[1], Math.max(map.z, L.k === 'st' ? 15.6 : 15));
    placePins();
    const q = (L.k === 'st' ? L.t + '역 나고야' : L.t);
    const href = meLL ? gdir(meLL[0] + ',' + meLL[1], JP[L.t] || q, 'transit') : gmap(JP[L.t] || q);
    sheet((L.k === 'st' ? '🚇 ' : '📍 ') + L.t, href, '닫기', () => { fsheet.hidden = true; }, L.ll);
  };

  /* ---------- 컨트롤 ---------- */
  let fitAll = false;
  $('#btnFit').addEventListener('click', (e) => {
    if (!DAYS[dayIdx]) return;
    fitAll = !fitAll;
    e.currentTarget.setAttribute('aria-pressed', fitAll ? 'true' : 'false');
    fitDay(DAYS[dayIdx], fitAll);
  });
  $('#btnIn').addEventListener('click', () => map.zoomTo(map.z + 1));
  $('#btnOut').addEventListener('click', () => map.zoomTo(map.z - 1));
  const fsheet = $('#fsheet');
  function setFull(on) {
    document.body.classList.toggle('full', on);
    $('#btnFull').setAttribute('aria-pressed', on ? 'true' : 'false');
    $('#btnFull').firstChild.textContent = on ? '✕' : '⛶';
    $('#btnFull').querySelector('.lbl').textContent = on ? '닫기' : '크게';
    if (!on) fsheet.hidden = true;
    requestAnimationFrame(() => { map.resize(); placePins(); fabSync(); });
  }
  const isFull = () => document.body.classList.contains('full');
  $('#btnFull').addEventListener('click', () => setFull(!isFull()));
  $('#fab').addEventListener('click', () => setFull(true));

  /* 지도가 화면에서 벗어나면 떠 있는 '지도' 버튼을 보여준다 */
  const fabSync = () => {
    const r = $('#mapwrap').getBoundingClientRect();
    const away = r.bottom < 64;
    $('#fab').classList.toggle('show', !isFull() && dayIdx >= 0 && away);
    if (away && !isFull()) fsheet.hidden = true;
  };
  window.addEventListener('scroll', fabSync, { passive: true });
  window.addEventListener('resize', fabSync);
  function scrollToStop(si) {
    const li = main.querySelectorAll('.tl > li')[si];
    if (!li) return;
    const off = $('.hd').offsetHeight + $('#tabs').offsetHeight + 8;
    window.scrollTo({ top: Math.max(0, li.getBoundingClientRect().top + window.scrollY - off), behavior: 'smooth' });
  }
  const M = (a, b) => {
    const R = 6371000, d1 = (b[0] - a[0]) * Math.PI / 180, d2 = (b[1] - a[1]) * Math.PI / 180;
    const x = Math.sin(d1 / 2) ** 2 + Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.sin(d2 / 2) ** 2;
    return Math.round(2 * R * Math.asin(Math.sqrt(x)));
  };
  const dist = (ll) => {
    if (!meLL || !ll) return '';
    const m = M(meLL, ll);
    return ' · 내 위치에서 ' + (m > 1200 ? (m / 1000).toFixed(1) + 'km' : m + 'm');
  };
  let sheetAct = null;
  $('#fsheetX').addEventListener('click', () => { if (sheetAct) sheetAct(); });
  function sheet(title, href, actLabel, act, ll) {
    fsheet.hidden = false;
    $('#fsheetT').textContent = title + dist(ll);
    const g = $('#fsheetG');
    if (href) { g.hidden = false; g.href = href; g.textContent = meLL ? '내 위치 → 길찾기 ↗' : '구글맵 ↗'; } else g.hidden = true;
    $('#fsheetX').textContent = actLabel;
    sheetAct = act;
  }
  function showSheet(st) {
    if (!isFull()) { fsheet.hidden = true; return; }
    const ll = llOf(st);
    const href = st.q ? (meLL ? gdir(meLL[0] + ',' + meLL[1], st.q, 'transit') : gmap(st.q)) : '';
    sheet(st.t + ' · ' + st.name, href, '일정 보기', () => { const si = stopIdx; setFull(false); if (si >= 0) scrollToStop(si); }, ll);
  }
  $('#btnHide').addEventListener('click', (e) => {
    const w = $('#mapwrap');
    w.classList.toggle('hid');
    const hid = w.classList.contains('hid');
    e.currentTarget.querySelector('.lbl').textContent = hid ? '지도' : '접기';
    e.currentTarget.firstChild.textContent = hid ? '▸' : '▾';
    if (!hid) requestAnimationFrame(() => { map.resize(); placePins(); });
  });
  $('#btnStyle').addEventListener('click', (e) => {
    const to = map.style === 'clean' ? 'osm' : 'clean';
    map.setStyle(to);
    mapbox.classList.toggle('osmtiles', to === 'osm');
    e.currentTarget.setAttribute('aria-pressed', to === 'osm' ? 'true' : 'false');
    e.currentTarget.querySelector('.lbl').textContent = to === 'osm' ? '깔끔' : '상세';
    e.currentTarget.firstChild.textContent = to === 'osm' ? '🇯🇵' : '🗺';
    setAttr(map.tileMode);
    placePins();
  });
  let geoWatch = null, geoFirst = true;
  const baseMsg = () => { msgEl.hidden = map.tileMode; if (!map.tileMode) msgEl.innerHTML = '타일 서버를 못 불러와서 <b>내장 OSM 벡터 지도</b>로 그렸어 — 노선·물·공원은 실제 좌표야.'; };
  const tellMsg = (t) => { msgEl.hidden = false; msgEl.innerHTML = t; };
  function geoStop() {
    if (geoWatch != null && navigator.geolocation) navigator.geolocation.clearWatch(geoWatch);
    geoWatch = null; geoFirst = true; meLL = null; map.me = null;
    if (mePin) { mePin.remove(); mePin = null; }
    $('#btnGeo').setAttribute('aria-pressed', 'false');
    $('#btnGeo').querySelector('.lbl').textContent = '내 위치';
    baseMsg(); map.draw();
  }
  function geoStart() {
    if (!navigator.geolocation) { tellMsg('이 브라우저에선 위치를 쓸 수 없어.'); return; }
    $('#btnGeo').setAttribute('aria-pressed', 'true');
    $('#btnGeo').querySelector('.lbl').textContent = '위치 ON';
    tellMsg('내 위치 찾는 중…');
    geoWatch = navigator.geolocation.watchPosition((pos) => {
      meLL = [pos.coords.latitude, pos.coords.longitude];
      map.me = { ll: meLL, acc: pos.coords.accuracy || 0 };
      if (!mePin) {
        mePin = document.createElement('div');
        mePin.className = 'pin me';
        mePin.title = '내 위치';
      }
      if (!mePin.parentNode) pinsEl.appendChild(mePin);
      if (geoFirst) {
        geoFirst = false;
        map.setView(meLL[0], meLL[1], Math.max(map.z, 15.4));
        baseMsg();
      }
      placePins(); map.draw();
    }, (err) => {
      const why = err && err.code === 1 ? '위치 권한이 거부됐어 — 설정에서 이 사이트의 위치 접근을 허용해줘.'
        : err && err.code === 3 ? '위치를 찾는 데 시간이 너무 걸려. 실외에서 다시 눌러줘.'
        : '위치를 못 가져왔어.';
      tellMsg(why);
      geoStop();
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 4000 });
  }
  const GEOKEY = 'nagoya-geo';
  $('#btnGeo').addEventListener('click', () => {
    if (geoWatch == null) { geoStart(); try { localStorage.setItem(GEOKEY, '1'); } catch (e) {} }
    else { geoStop(); try { localStorage.removeItem(GEOKEY); } catch (e) {} }
  });
  /* 한 번 켰으면 다음에 열 때 알아서 다시 켠다 (처음엔 권한 창을 띄우지 않음) */
  try { if (localStorage.getItem(GEOKEY) === '1') setTimeout(geoStart, 600); } catch (e) {}

  /* ---------- 카운트다운 · 첫 화면 ---------- */
  (function boot() {
    const now = new Date();
    const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = Math.round((START - day0) / 86400000);
    const el = $('#dcount');
    let start = 0;
    if (diff > 0) el.textContent = 'D-' + diff;
    else if (diff <= 0 && diff > -5) { el.textContent = 'Day ' + (1 - diff) + ' 진행 중'; start = -diff; }
    else el.textContent = '여행 완료 🍁';
    renderTabs();
    selectDay(Math.min(DAYS.length - 1, start));
  })();
})();
</script>
