<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F15" media="(prefers-color-scheme: dark)">
<meta name="description" content="나고야 4박 5일 뚜벅이 일정 — OpenStreetMap 실지도 위의 하루 동선, 지하철 노선·구글맵 길찾기·예외 상황까지.">
<title>나고야 뚜벅이 노선도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
/*__CSS__*/
</style>
</head>
<body>
<!--ARTIFACT-START-->
<!--ARTIFACT-HEAD-->
<div class="app">
  <header class="hd">
    <div class="hd-in">
      <span class="leaf" aria-hidden="true">🍁</span>
      <div class="hd-t">
        <h1>나고야 뚜벅이 노선도</h1>
        <p class="hd-s"><span class="mono">2026.10.21 – 10.25</span> · 4박 5일 · 상미 &amp; 호동</p>
      </div>
      <span class="dcount mono" id="dcount"></span>
    </div>
  </header>

  <nav class="days" id="tabs" role="tablist" aria-label="날짜 선택"></nav>

  <section class="mapwrap" id="mapwrap" aria-label="하루 동선 지도">
    <div class="mapbar">
      <span class="mapt" id="mapTitle">Day 1 동선</span>
      <span class="mapbtns">
        <button type="button" class="mb" id="btnFit" title="오늘 동선 전체 보기">⤢<span class="lbl">전체</span></button>
        <button type="button" class="mb" id="btnGeo" title="내 위치">◎<span class="lbl">내 위치</span></button>
        <button type="button" class="mb" id="btnFull" title="지도 크게 보기">⛶<span class="lbl">크게</span></button>
        <button type="button" class="mb" id="btnHide" title="지도 접기">▾<span class="lbl">접기</span></button>
      </span>
    </div>
    <div class="mapbox" id="mapbox">
      <canvas id="cv"></canvas>
      <canvas id="cvTop"></canvas>
      <div class="pins" id="pins"></div>
      <div class="zoomers">
        <button type="button" class="zb" id="btnIn" aria-label="확대">+</button>
        <button type="button" class="zb" id="btnOut" aria-label="축소">−</button>
      </div>
      <p class="attr" id="attr">© OpenStreetMap 기여자</p>
      <p class="mapmsg" id="mapmsg" hidden></p>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <main id="main"></main>
  <section id="infoPane" hidden></section>

  <footer class="ft">
    <span>일정 원본 · 똥땅의 투어 노션</span>
    <span>영업시간은 2026년 8월 확인 기준 — 출발 전 한 번 더 확인!</span>
    <span>지도 데이터 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자 · ODbL</span>
  </footer>
</div>
<script>

/*__APP__*/
</script>
<!--ARTIFACT-END-->
</body>
</html>
